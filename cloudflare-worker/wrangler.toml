name = "httrack"
main = "src/index.js"
compatibility_date = "2024-01-01"

# Custom Domain binding for cdn.mikolabs.xyz
routes = [
  { pattern = "cdn.mikolabs.xyz", custom_domain = true }
]

[vars]
ACTOR_ID = "mikolabs~web-extractor"
CDN_URL = "https://cdn.mikolabs.xyz"

# Sensitive secrets (APIFY_TOKEN, AUTH_BEARER_TOKEN, RAPIDAPI_PROXY_SECRET)
# are configured in Cloudflare Dashboard Secrets or .dev.vars for local dev:
#   npx wrangler secret put APIFY_TOKEN
#   npx wrangler secret put AUTH_BEARER_TOKEN
#   npx wrangler secret put RAPIDAPI_PROXY_SECRET
